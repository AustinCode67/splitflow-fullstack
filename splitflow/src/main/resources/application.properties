spring.application.name=splitflow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.price-plus=${STRIPE_PRICE_PLUS}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
